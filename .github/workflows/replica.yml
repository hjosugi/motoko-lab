name: Replica

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: replica-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  replica:
    name: Replica integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # apps/02_merkle_anchor upgrades from the v2026.09.22 build to check a
          # batch anchored before tree versions were enforced survives and is
          # not reinterpreted, and reads that build from the tag.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install ICP and Motoko tooling
        run: ./scripts/bootstrap_toolchain.sh
      # The suites compile each canister with the pinned `moc`, which needs
      # `mo:core` on the package path. Same registry fallback the rest of the
      # repository uses, so a blocked Mops registry does not take this out.
      - name: Install application dependencies
        run: |
          source ./scripts/toolchain_env.sh
          motoko_add_toolchain_to_path
          for app in apps/*/; do
            [ -f "$app/mops.toml" ] || continue
            ( cd "$app" && ( mops install || "$GITHUB_WORKSPACE/scripts/vendor_core_offline.sh" "$PWD" ) )
          done
      - name: Download the replica
        run: node tools/pocket-ic/setup.mjs
      - name: Run the replica suites
        run: |
          source ./scripts/toolchain_env.sh
          motoko_add_toolchain_to_path
          node tools/pocket-ic/run.mjs
      # Not an application suite: the C2PA bridge (#10) end to end against app
      # 01 — a credential naming a certified record, verified online and from a
      # saved bundle, before and after the record is revoked.
      - name: Run the C2PA bridge against a replica
        run: |
          source ./scripts/toolchain_env.sh
          motoko_add_toolchain_to_path
          node tools/pocket-ic/c2pa-bridge.test.mjs
