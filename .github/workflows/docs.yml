name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pages deployment needs these; the build job below runs without them on a PR.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install the docs toolchain
        run: pip install -r requirements-docs.txt
      # Before staging, because a rewriter that has quietly stopped rewriting
      # still stages cleanly and still builds: `--strict` asks whether a link
      # resolves, never whether it was supposed to be changed.
      - name: Check the link rewriter
        run: python3 scripts/build_docs_site.py --self-test
      # `--check` fails when a page is staged but missing from the nav in
      # mkdocs.yml, and `--strict` fails on a broken internal link. Between them
      # a document cannot become unreachable without the build going red.
      - name: Stage and build
        run: |
          python3 scripts/build_docs_site.py --check
          mkdocs build --strict
      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # Only from the default branch: a pull request builds the site to prove it
    # still builds, and publishes nothing.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
