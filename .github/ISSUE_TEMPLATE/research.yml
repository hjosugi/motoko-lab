name: Research task
description: Time-boxed investigation with a decision output
title: "research: "
labels: ["type:research"]
body:
  - type: textarea
    id: question
    attributes:
      label: Decision question
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: "Example: 3 days"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence and sources
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected decision record
    validations:
      required: true
