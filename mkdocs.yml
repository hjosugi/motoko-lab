# Documentation site for the Motoko Mastery Kit.
#
# `docs_dir` is `site-src/`, which `scripts/build_docs_site.py` stages from the
# repository. The kit's Markdown lives next to what it describes rather than in
# one directory, and staging preserves those relative paths so every link keeps
# working without rewriting anything. Build with `make docs`, not with `mkdocs`
# directly — `site-src/` is generated and gitignored.
#
# The nav below is written by hand on purpose. It is the reading order, which is
# a judgement no directory listing can make: `docs/` is numbered for a reason and
# the apps go from the flagship to the most recent. `build_docs_site.py --check`
# fails when a staged page is missing from it, so a new document cannot silently
# become unreachable.

site_name: Motoko Mastery Kit
site_description: Motokoを初級から本番運用、言語処理系への貢献まで一気通貫で学ぶ実践キット
site_url: https://hjosugi.github.io/motoko-lab/
repo_url: https://github.com/hjosugi/motoko-lab
repo_name: hjosugi/motoko-lab
edit_uri: ""

docs_dir: site-src
site_dir: site

copyright: Apache License 2.0

theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ja
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  # A staged page that is not in the nav is normal here: the 45 issue drafts are
  # indexed by the table in ISSUE_BACKLOG.md, which is a better index than a
  # 45-entry sidebar. Everything else is covered by `build_docs_site.py --check`.
  nav:
    omitted_files: info
  links:
    absolute_links: warn
    unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hjosugi/motoko-lab

