name: Bug report
description: Reproducible defect in a Motoko app or tool
title: "bug: "
labels: ["type:bug"]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, moc, core, Mops, icp-cli, commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed identities, secrets, and customer data.
          required: true
