[package]
name = "license-marketplace"
version = "0.1.0"
description = "Evidence-linked digital license marketplace reference backend"
repository = "https://github.com/hjosugi/motoko-lab/tree/main/apps/03_license_marketplace"
keywords = ["internet-computer", "motoko", "reference-app"]
license = "Apache-2.0"

[dependencies]
core = "2.6.0"
# SHA-256 for the payment intent memo. The same package and version apps/01
# and apps/02 use: Apache-2.0, research-ag/sha2, `core` its only dependency.
sha2 = "0.2.5"

[toolchain]
moc = "1.11.1"

[canisters.backend]
main = "backend/src/main.mo"
candid = "backend/candid/backend.did"
